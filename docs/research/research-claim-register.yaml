  exact_page_section: report pp. 21-24 (PDF pp. 22-25), §3.3
  bounded_claim: For nearly half of collateralized PPG lending in the HCC dataset, the same asset or asset pool supports more
    than one loan; the paper identifies 52 cash collateral pools securing multiple debts and describes long-lived control
    implications.
  claim_type: EMPIRICAL_DATASET_FINDING
  scope_conditions:
  - HCC Dataset v1.0; predominantly same-creditor cross-collateralization in the documented cases.
  approved_downstream_use:
  - dependency graphs
  - claim/asset linkage
  - scenario-time and encumbrance mechanics
  prohibited_inference:
  - Do not infer competing creditor claims where the dataset instead shows the same creditor or group, or infer a specific
    restructuring outcome from cross-collateralization alone.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-WB-001
