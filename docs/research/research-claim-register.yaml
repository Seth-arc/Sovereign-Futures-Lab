  bounded_claim: 'The World Bank note presents four statutory approaches that jurisdictions could consider to encourage private-sector
    creditor participation: a duty to cooperate, limits on recoveries, additional immunity from attachment, and retrofitting
    collective action mechanisms.'
  claim_type: POLICY_PROPOSAL
  scope_conditions:
  - The note presents options and legal considerations as of 2022; applicability depends on jurisdiction and instrument.
  approved_downstream_use:
  - future scenario variants
  - policy-option context
  prohibited_inference:
