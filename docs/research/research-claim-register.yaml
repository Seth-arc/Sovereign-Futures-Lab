  bounded_claim: Nearly two-thirds of the HCC collateralized PPG lending volume draws on assets unrelated to the financed
    project, and more than 70% of the portfolio collateralized against revenues relies on quasi-collateral arrangements providing
    effective control rather than only formal security grants.
  claim_type: EMPIRICAL_DATASET_FINDING
  scope_conditions:
  - HCC Dataset v1.0 classification of related/unrelated collateral and formal/quasi-collateral.
  approved_downstream_use:
  - treatment-perimeter reasoning
  - liquidity/encumbrance model
  - mechanic design
  prohibited_inference:
  - Do not infer that effective control guarantees enforcement or that all such arrangements have identical legal effect.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
