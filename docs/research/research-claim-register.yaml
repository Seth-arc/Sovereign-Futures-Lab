  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-HCL-001
  source_id: SRC-HCL-2021
  exact_page_section: PDF/report pp. 4-5 and 11-15, Introduction and Dataset
  bounded_claim: The study analyzes 100 publicly available loan contracts signed between 2000 and 2020 between Chinese state-owned
    entities and government borrowers in 24 developing countries; the sample is informative but not random and is a small
    part of the broader lending universe.
  claim_type: EMPIRICAL_SAMPLE_SCOPE
  scope_conditions:
  - All uses must preserve the sample, period, creditor, and public-availability boundaries.
  approved_downstream_use:
  - Source-scope controls
  - scenario provenance
  - public caveats
  prohibited_inference:
  - Do not universalize frequencies or terms to every Chinese loan, country, or period.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-HCL-002
  source_id: SRC-HCL-2021
  exact_page_section: PDF/report pp. 6-8 and 22-25, Summary and §3.1
  bounded_claim: In the study's Chinese contract sample, borrower-facing confidentiality clauses are unusually broad relative
    to its benchmark sample, particularly in post-2014 China Eximbank contracts.
  claim_type: EMPIRICAL_CONTRACT_FEATURE
  scope_conditions:
  - Contract sample and periods analyzed by HCL; individual contract wording and legal carve-outs matter.
  approved_downstream_use:
  - information-visibility mechanic
  - disclosure/verification constraint
  - source-controlled creditor-specific scenario content
  prohibited_inference:
  - Do not infer illegality, bad faith, actual nondisclosure in every case, or actual creditor conduct from clause existence.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-HCL-003
  source_id: SRC-HCL-2021
  exact_page_section: PDF/report pp. 26-31, §3.2
  bounded_claim: The study finds special or escrow accounts used as repayment security in a meaningful subset of its Chinese
    contract sample and reports little evidence in that sample that Chinese state-owned banks routinely use physical infrastructure
    such as seaports or power plants as collateral.
  claim_type: EMPIRICAL_CONTRACT_FEATURE
  scope_conditions:
  - HCL sample only; account details are sometimes contained in unavailable related agreements.
  approved_downstream_use:
  - restricted-liquidity mechanic
  - verification need
  - misconception target for physical-asset collateral
  prohibited_inference:
  - Do not translate 'collateral' into physical asset seizure or infer that all account arrangements operate identically.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-HCC-001
  source_id: SRC-HCC-2025
  exact_page_section: report pp. 10-13 (PDF pp. 11-14), §3.1
  bounded_claim: The HCC dataset identifies 620 collateralized PPG loan commitments by Chinese state-owned creditors to 158
    borrowers in 57 EMDEs during 2000-2021; 46% of the studied PPG lending volume is classified as collateralized, which the
    authors describe as a lower-bound estimate.
  claim_type: EMPIRICAL_DATASET_FINDING
  scope_conditions:
  - HCC Dataset v1.0, 2000-2021, PPG lending to EMDEs.
  approved_downstream_use:
  - empirical baseline
  - scenario calibration bounds
  - source-backed contextual briefing
  prohibited_inference:
  - Do not claim all Chinese PPG lending is collateralized or extend the percentage outside the dataset/timeframe without
    new evidence.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-HCC-002
  source_id: SRC-HCC-2025
  exact_page_section: report pp. 14-17 (PDF pp. 15-18), Box 3.1 and Figure 3
  bounded_claim: In the HCC collateralized PPG lending portfolio, bank deposits and revenue claims are the dominant forms
    of collateral or quasi-collateral by lending volume, while physical and illiquid assets account for much smaller shares.
  claim_type: EMPIRICAL_DATASET_FINDING
  scope_conditions:
  - HCC Dataset v1.0 definitions and classification; shares can overlap because a loan may have multiple collateral types.
  approved_downstream_use:
  - usable-liquidity mechanic
  - restricted-account representation
  - collateral taxonomy
  prohibited_inference:
  - Do not infer that every secured transaction uses an offshore bank account or that physical assets are never used.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-HCC-003
