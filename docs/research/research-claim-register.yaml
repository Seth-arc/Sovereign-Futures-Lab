  title: Sovereign Room Research Claim Register
  status: ACTIVE
  canonical_home: docs/research/research-claim-register.yaml
  owner: Research Governance
  reserved_authority_decision_required: false
  updated_at: '2026-09-30'
claim_control_rules:
- Every material external factual proposition used in simulation content, rules, mechanics, assessment, or public writing
  must reference an approved claim_id.
- A claim remains bounded by its source population, timeframe, methodology, and page/section trace.
- Contract clauses establish contractual text or structure, not actual behavior, enforcement, motive, or legality unless a
  separate source supports that proposition.
- Policy proposals remain proposals; illustrative templates remain illustrative.
- Training observations do not promote themselves into the Empirical Research Baseline.
page_reference_convention: Claim traces use physical PDF page numbers unless the document has a different printed/report page
  number; where those differ, both are stated explicitly. DOCX traces use the visible page/table location.
claims:
- claim_id: CLAIM-CF-001
  source_id: SRC-CF-2020
  exact_page_section: PDF p. 1, 'Need for Debt Treatment and Debt eligible to the Treatment'
  bounded_claim: Under the Common Framework, the process is initiated at the debtor country's request; the need for treatment
    and restructuring envelope are based on the IMF-WBG DSA and participating official creditors' collective assessment and
    are to be consistent with parameters of an upper-credit-tranche IMF-supported program.
  claim_type: OFFICIAL_PROCESS
  scope_conditions:
  - Applies to Common Framework debt-treatment requests within the framework's eligibility and institutional scope.
  approved_downstream_use:
  - Scenario dependency graph
  - Financing Assurances process context
  - DSA/collective-assessment state representation
  prohibited_inference:
  - Do not turn this dependency statement into a rigid universal chronology or claim that one institution alone determines
    the envelope.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-CF-002
  source_id: SRC-CF-2020
  exact_page_section: PDF p. 1, 'Need for Debt Treatment and Debt eligible to the Treatment'
  bounded_claim: The 2020 Common Framework states that eligible debt includes public and publicly guaranteed debt with original
    maturity of more than one year, while taking account of the DSSI cut-off date protecting new financing after 24 March
    2020.
  claim_type: OFFICIAL_PROCESS
  scope_conditions:
  - Use as the 2020 framework baseline; later case-specific treatment scope and cut-off decisions can differ.
  approved_downstream_use:
  - Treatment-perimeter mechanics
  - claim classification
  prohibited_inference:
  - Do not imply every later OCC uses exactly the same cut-off date or treatment perimeter.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-CF-003
  source_id: SRC-CF-2020
  exact_page_section: PDF p. 1, final paragraph under 'Need for Debt Treatment and Debt eligible to the Treatment'
  bounded_claim: A debtor requesting treatment is expected to provide the IMF, World Bank Group, and participating creditors
    necessary information regarding public-sector financial commitments while respecting commercially sensitive information.
  claim_type: OFFICIAL_INFORMATION_REQUIREMENT
  scope_conditions:
  - Common Framework process; precise disclosure content and legal ability can remain case- and contract-specific.
  approved_downstream_use:
  - Information-state mechanics
  - verification requests
  - disclosure constraints
  prohibited_inference:
  - Do not infer that all creditors or participants automatically possess all contract details, or that commercial sensitivity
    implies bad faith.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-CF-004
  source_id: SRC-CF-2020
  exact_page_section: PDF pp. 1-2, 'Coordination among Official Bilateral Creditors' and 'Comparability of Treatment with
    Other Creditors'
  bounded_claim: The framework provides for coordinated official bilateral treatment and requires the debtor to seek from
    other official bilateral and private creditors treatment at least as favorable; comparable efforts are assessed using
    changes in nominal debt service, debt stock in NPV terms, and duration of treated claims.
  claim_type: OFFICIAL_PROCESS
  scope_conditions:
  - Common Framework baseline; assessment remains case-specific and later guidance recognizes flexibility across indicators.
  approved_downstream_use:
  - CoT workbench inputs
  - creditor-coordination mechanics
  prohibited_inference:
  - Do not collapse Comparability of Treatment into a single haircut formula.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-CF-005
  source_id: SRC-CF-2020
  exact_page_section: PDF p. 1, final paragraph under 'Coordination among Official Bilateral Creditors'
  bounded_claim: Key treatment parameters are recorded in a legally non-binding MoU, while participating creditors implement
    the MoU through bilateral agreements with the debtor country.
  claim_type: OFFICIAL_IMPLEMENTATION_DISTINCTION
  scope_conditions:
  - Common Framework official bilateral treatment.
  approved_downstream_use:
  - Implementation lifecycle
  - agreement/effectiveness distinction
  - Record Line explanation
  prohibited_inference:
  - Do not claim an MoU itself creates realized cash relief or that signing completes all bilateral implementation.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-G20-001
  source_id: SRC-G20-LL-2024
  exact_page_section: PDF pp. 2-5, Summary and §1.1
  bounded_claim: The 2024 G20 lessons note describes the Common Framework as a case-by-case coordination platform and summarizes
    major process steps while calling for improved timeliness, predictability, clarity, and information sharing.
  claim_type: OFFICIAL_LESSONS
  scope_conditions:
  - Lessons from Chad, Zambia, Ghana, and Ethiopia through October 2024.
  approved_downstream_use:
  - Scenario dependency design
  - process-friction calibration
  - facilitator/debrief explanation
  prohibited_inference:
  - Do not represent the summarized steps as a fixed waterfall or treat four cases as a universal causal model.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-G20-002
  source_id: SRC-G20-LL-2024
  exact_page_section: PDF p. 6, text below Table 1
  bounded_claim: The G20 note states that restructurings are time-consuming at each stage because creditors examine commitments,
    solve technical issues, and obtain internal approvals, while debtors assemble data including individual cashflows for
    debt reconciliation.
  claim_type: OFFICIAL_LESSONS
  scope_conditions:
  - Observed lessons from the cases synthesized by the G20 note.
  approved_downstream_use:
  - Authority-delay calibration
  - data-reconciliation mechanics
  - dependency timing
  prohibited_inference:
  - Do not assign all delay to one creditor or infer a universal duration for any step.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-G20-003
  source_id: SRC-G20-LL-2024
  exact_page_section: PDF p. 11, §1.4
  bounded_claim: The 2024 G20 note lists three Comparability of Treatment indicators—change in debt stock NPV, change in duration,
    and change in nominal debt service over the IMF program period—and states that assessment includes flexibility because
    greater effort on one parameter can be mitigated by smaller effort on another.
  claim_type: OFFICIAL_LESSONS
  scope_conditions:
  - Common Framework CoT implementation as discussed in the 2024 note.
  approved_downstream_use:
  - CoT workbench
  - misconception target against single-formula comparisons
  prohibited_inference:
  - Do not infer that any one indicator is dispositive in every case or that the note defines a single haircut formula.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-MOU-001
  source_id: SRC-G20-MOU-TEMPLATE
  exact_page_section: PDF p. 1, preamble ¶¶2-3
  bounded_claim: The illustrative MoU template depicts financing assurances as a step that can pave the way for IMF Executive
    Board approval, followed separately by quantified treatment terms, agreement in principle, and MoU agreement.
  claim_type: ILLUSTRATIVE_PROCESS
  scope_conditions:
  - Illustrative only; the template expressly states that provisions are not universally applicable and cases remain tailored.
  approved_downstream_use:
  - State-machine examples for assurance/agreement/implementation
  - scenario authoring
  prohibited_inference:
  - Do not claim every Common Framework case follows this exact sequence or that financing assurances are final commitments
    from every creditor.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-MOU-002
  source_id: SRC-G20-MOU-TEMPLATE
  exact_page_section: PDF p. 2, footnote 3
  bounded_claim: The illustrative template states that debts covered by its debt-treatment article include debts with security
    arrangements.
  claim_type: ILLUSTRATIVE_TREATMENT_SCOPE
  scope_conditions:
  - Illustrative template; actual treatment perimeter remains subject to OCC decisions and case-specific terms.
  approved_downstream_use:
