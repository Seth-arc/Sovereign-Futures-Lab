  - secured-claim representation
  prohibited_inference:
  - Do not infer that every secured claim is treated identically or that security is irrelevant to comparability and implementation.
  confidence: HIGH
  public_use_status: APPROVED_WITH_SCOPE
- claim_id: CLAIM-MOU-003
  source_id: SRC-G20-MOU-TEMPLATE
  exact_page_section: PDF p. 5, footnote 7
  bounded_claim: For illustrative CoT information sharing, the template identifies typical financial parameters and also notes
    non-financial terms that could affect CoT, including financial covenants, collateral, negative pledges, embedded options,
    contingencies, and other provisions that could confer a material benefit.
  claim_type: ILLUSTRATIVE_INFORMATION_REQUIREMENT
  scope_conditions:
  - Illustrative template; exact information and legal disclosure constraints remain case-specific.
  approved_downstream_use:
  - CoT evidence model
  - verification mechanics
  - contract-detail decision significance
  prohibited_inference:
  - Do not claim every listed term changes CoT in every case or that contract clauses determine creditor behavior.
