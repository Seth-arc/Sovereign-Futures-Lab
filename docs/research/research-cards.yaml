  source_title: Potential Statutory Options to Encourage Private Sector Creditor Participation in the Common Framework
  source_class: POLICY_OPTIONS_NOTE
  retrieval_tier: SUPPLEMENTAL
  bounded_claim: >-
    The World Bank note presents four statutory approaches that jurisdictions could consider to encourage private-sector
    creditor participation: a duty to cooperate, limits on recoveries, additional immunity from attachment, and retrofitting
    collective action mechanisms.
  exact_page_reference: "report p. 3 and pp. 7-11 (PDF p. 4 and pp. 8-12), Background summary and 'Potential Statutory Options'"
  scope_conditions:
  - The note presents options and legal considerations as of 2022; applicability depends on jurisdiction and instrument.
  prohibited_inferences:
  - Do not represent these options as current universally applicable law.
  - Do not represent these options as existing Common Framework requirements.
  public_use_status: APPROVED_IF_LABELED_PROPOSAL
  required_public_label: World Bank policy options, not current universal law
  supporting_excerpt:
