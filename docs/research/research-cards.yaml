card_control_rules:
- Each card is a bounded retrieval unit, not permission to use unregistered facts from the same source.
- Scope conditions and prohibited inferences travel with the claim whenever it is retrieved or cited.
- Scenario facts and deterministic engine outputs outrank external research when describing the live workshop state.
- Policy proposals must be labeled as proposals; illustrative templates must be labeled as illustrative and non-binding.
- Supporting excerpts are short verification anchors. Advisors should paraphrase the bounded claim and cite its source rather
  than expand the excerpt beyond the registered scope.
- Runtime provider requests may contain only selected card fields and these short excerpts. They must never contain source
  files, repository paths, or full report bodies.
- Only cards with an approved public-use status may enter advisor retrieval.
- Claims with blocked public-use status, including the unverified progress chronology, must never enter the runtime index.
- Policy-proposal cards may be retrieved only when the participant explicitly asks a policy or reform question.
- Initial advisor retrieval uses deterministic topic and keyword matching over this bounded card set; embeddings are not required.
cards:
- claim_id: CLAIM-CF-001
  source_id: SRC-CF-2020
  source_title: Common Framework for Debt Treatments beyond the DSSI
  source_class: OFFICIAL_INSTITUTIONAL_PROCESS
  retrieval_tier: CORE
  bounded_claim: >-
    Under the Common Framework, the process is initiated at the debtor country's request; the need for treatment and
    restructuring envelope are based on the IMF-WBG DSA and participating official creditors' collective assessment and
    are to be consistent with parameters of an upper-credit-tranche IMF-supported program.
  exact_page_reference: "PDF p. 1, 'Need for Debt Treatment and Debt eligible to the Treatment'"
  scope_conditions:
  - Applies to Common Framework debt-treatment requests within the framework's eligibility and institutional scope.
  prohibited_inferences:
  - Do not turn this dependency statement into a rigid universal chronology.
  - Do not claim that one institution alone determines the restructuring envelope.
  public_use_status: APPROVED_WITH_SCOPE
  supporting_excerpt:
    text: The process will be initiated at the request of a debtor country.
    kind: VERBATIM
    verified_source_path: docs/research/sources/g20-paris-club/common-framework.pdf
    verified_pdf_page: 1
  advisor_tags: [amara]
  topic_tags: [common-framework, debt-treatment-request, dsa, restructuring-envelope, imf-program]
