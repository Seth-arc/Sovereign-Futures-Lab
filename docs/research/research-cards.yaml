  source_class: OFFICIAL_INSTITUTIONAL_PROCESS
  retrieval_tier: CORE
  bounded_claim: >-
    The 2020 Common Framework states that eligible debt includes public and publicly guaranteed debt with original maturity
    of more than one year, while taking account of the DSSI cut-off date protecting new financing after 24 March 2020.
  exact_page_reference: "PDF p. 1, 'Need for Debt Treatment and Debt eligible to the Treatment'"
  scope_conditions:
  - Use as the 2020 framework baseline; later case-specific treatment scope and cut-off decisions can differ.
  prohibited_inferences:
  - Do not imply every later Official Creditor Committee uses exactly the same cut-off date or treatment perimeter.
  public_use_status: APPROVED_WITH_SCOPE
  supporting_excerpt:
