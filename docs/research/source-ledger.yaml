source_use_rules:
- Use original research and official institutional sources for external factual claims only within their evidenced scope.
- Use the narrowest sufficient source set; broader contextual sources do not override narrower evidence.
- Sample-based findings may not be universalized to all lenders, contracts, countries, or periods.
- Illustrative templates and policy proposals may not be represented as universally binding process or law.
- Contract text does not by itself establish enforcement, motive, or actual creditor behavior.
- Participant behavior may inform Scenario Calibration or generate Research Hypotheses; it does not automatically modify the
  Empirical Research Baseline.
- If evidence is insufficient, classify the proposition as SOURCE GAP or RESEARCH HYPOTHESIS rather than filling it with model
  knowledge.
