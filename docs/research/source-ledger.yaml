- source_id: SRC-HCL-2021
  exact_title: 'How China Lends: A Rare Look into 100 Debt Contracts with Foreign Governments'
  authors_institution:
  - Anna Gelpern — Georgetown Law / Peterson Institute for International Economics
  - Sebastian Horn — Kiel Institute for the World Economy
  - Scott Morris — Center for Global Development
  - Brad Parks — AidData, William & Mary / Center for Global Development
  - Christoph Trebesch — Kiel Institute / Kiel University / CEPR
  publication_date: 2021-03
  source_class: EMPIRICAL_CONTRACT_ANALYSIS
  original_file: How_China_Lends__A_Rare_Look_into_100_Debt_Contracts_with_Foreign_Governments.pdf
  repository_path: docs/research/sources/aiddata/how-china-lends.pdf
  checksum_sha256: 8d85f4900364eb989847185f1b3edea06c5d9d3867aa1d6b7cabdbeda5a50204
  population_case_scope: 100 publicly available debt contracts between Chinese state-owned entities and government borrowers
    in 24 developing countries; benchmark of 142 contracts.
  timeframe: Chinese contracts signed 2000-2020.
  methodology_basis: Systematic contract collection, coding of 100 variables, independent coding teams, and benchmark comparison.
  authority_scope:
  - terms in the studied contract sample
  - confidentiality clauses
  - special/revenue account arrangements
  - No Paris Club clauses
  - default/cancellation and enforcement terms
  - sample and methodology limitations
  allowed_uses:
  - contractual-information mechanics
  - restricted-account and verification mechanics
  - creditor-specific contract feature scenarios where scope-matched
  prohibited_uses:
  - inferring actual creditor behavior or enforcement from clause existence
  - claiming confidentiality implies illegality or bad faith
  - universalizing sample findings to every Chinese loan
  - claiming collateral inherently means seizure of physical infrastructure
  limitations:
  - Non-random public-availability sample; some documents/pages and related agreements are missing.
  - The study does not systematically establish implementation or enforcement behavior.
  public_citation_restrictions: PUBLIC_WITH_SAMPLE_SCOPE_AND_EXACT_PAGE_TRACE
- source_id: SRC-HCC-2025
  exact_title: How China Collateralizes
  authors_institution:
  - Anna Gelpern — Georgetown Law / Peterson Institute for International Economics
  - Omar Haddad — Oxford University
  - Sebastian Horn — Kiel Institute for the World Economy / University of Hamburg
  - Paulina Kintzinger — Kiel Institute for the World Economy
  - Bradley C. Parks — AidData, William & Mary / Center for Global Development
  - Christoph Trebesch — Kiel Institute for the World Economy / CEPR
  publication_date: 2025-06
  source_class: EMPIRICAL_SECURED_LENDING_DATASET_AND_ANALYSIS
  original_file: WPS136_How_China_Collateralizes.pdf
  repository_path: docs/research/sources/aiddata/how-china-collateralizes.pdf
  checksum_sha256: b1181d48213c28551d145da5da36fae41e154079f21ea8f1ae1109e343d5e1e8
  population_case_scope: 620 identified collateralized public and publicly guaranteed debt transactions from Chinese state-owned
    institutions across 57 EMDEs.
  timeframe: 2000-2021, with limited later contract-context references noted in the paper.
  methodology_basis: AidData HCC Dataset v1.0 built from GCDF/TUFF sources with manual standardized coding of collateral structures.
  authority_scope:
  - incidence and types of collateralization in the HCC dataset
  - bank-account and revenue-stream collateral/quasi-collateral
  - related versus unrelated collateral
  - cross-collateralization and cash pooling
  - account control and funding mechanics within documented transactions
  allowed_uses:
  - usable-liquidity and encumbrance mechanics
  - verification and visibility mechanics
  - cross-collateralization dependencies
  - bounded creditor-specific scenario construction
  prohibited_uses:
  - claiming all Chinese PPG loans are collateralized
  - equating collateral with physical-asset seizure
  - inferring practitioner behavior from the dataset
  - using participant behavior to revise the empirical dataset
  limitations:
  - Collateralization estimate is explicitly described as a lower bound based on available documentation.
  - Transparency limitations remain; source coverage varies by transaction.
  - The paper does not establish that every contractual right is exercised in practice.
  public_citation_restrictions: PUBLIC_WITH_DATASET_SCOPE_AND_EXACT_PAGE_TRACE
