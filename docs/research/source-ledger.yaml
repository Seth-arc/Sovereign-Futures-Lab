- source_id: SRC-CF-2020
  exact_title: Common Framework for Debt Treatments beyond the DSSI
  authors_institution:
  - G20
  - Paris Club
  publication_date: '2020-11-13'
  source_class: OFFICIAL_INSTITUTIONAL_PROCESS
  original_file: annex_common_framework_for_debt_treatments_beyond_the_dssi.pdf
  repository_path: docs/research/sources/g20-paris-club/common-framework.pdf
  checksum_sha256: 1b0198e5b2c2bd5890f93473eb7e1f0da5cd51ce66d6edab2b151a58482e7cfd
  population_case_scope: DSSI-eligible debtor countries requesting case-by-case debt treatment under the Common Framework.
  timeframe: Framework endorsed 13 November 2020; prospective process statement.
  methodology_basis: Official G20/Paris Club framework statement.
  authority_scope:
  - Common Framework purpose and eligibility framing
  - basis for debt-treatment need and restructuring envelope
  - official bilateral creditor coordination
  - key treatment parameters
  - Comparability of Treatment principle
  - non-binding MoU and bilateral implementation structure
  allowed_uses:
  - Common Framework process mechanics
  - official-creditor coordination logic
  - treatment-perimeter and Comparability of Treatment framing
  - agreement-versus-implementation distinction
  prohibited_uses:
  - asserting a rigid universal chronology
  - assuming all creditor classes provide identical assurances
  - treating Comparability of Treatment as one haircut formula
  - claiming an MoU itself creates realized cash relief
  limitations:
  - High-level framework statement; many operational details are case-specific.
  - Later lessons-learned material is needed for observed implementation frictions and sequencing.
  public_citation_restrictions: PUBLIC_WITH_EXACT_PAGE_OR_SECTION_TRACE
